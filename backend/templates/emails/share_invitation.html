<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مشاركة وثيقة معك</title>
</head>
<body style="font-family:Arial,sans-serif;background:#f4f6f8;padding:24px;">
<div style="max-width:560px;margin:auto;background:#ffffff;border-radius:8px;overflow:hidden;border:1px solid #e3e8ee;">
  <div style="background:#2a7a4b;color:#ffffff;padding:20px;text-align:center;">
    <h2 style="margin:0;">تمت مشاركة وثيقة معك</h2>
  </div>
  <div style="padding:24px;">
    <p>مرحباً,</p>
    <p>شارك <strong>{{ inviter.username }}</strong> معك وثيقة <strong>"{{ document }}"</strong> مع صلاحية <strong>{{ permission }}</strong>.</p>
    <div style="text-align:center;margin:28px 0;">
      <a href="{{ link }}" style="background:#2a7a4b;color:#ffffff;padding:12px 28px;border-radius:6px;text-decoration:none;display:inline-block;">عرض الوثيقة</a>
    </div>
    <p style="font-size:13px;color:#666;">تذكر دائماً ألا تشارك هذا الرابط مع أي شخص آخر.</p>
  </div>
</div>
</body>
</html>
